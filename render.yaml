services:
  - type: web
    name: procurement-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: SAM_API_KEY
        sync: false
      - key: USASPENDING_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
